<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Greeting Card</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      width: max-content;
      max-width: 85%;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    a-scene canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    video {
      object-fit: contain !important;
    }
  </style>
</head>

<body>
  <div id="status">Starting camera… Please wait.</div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

    <a-marker preset="hiro" smooth="true" smoothCount="5">

      <!-- 3D pink object -->
      <a-torus-knot position="0 0.25 0" color="#e84393" radius="0.12" radius-tubular="0.025" rotation="90 0 0"
        scale="0.8 0.8 0.8">
      </a-torus-knot>

      <!-- Visiting card floating above the pink object -->
      <a-entity position="0 0.95 0" rotation="-90 0 0">

        <!-- Card background -->
        <a-plane width="1.8" height="1.05" color="#172554" material="shader: flat; side: double">
        </a-plane>

        <!-- Pink accent strip -->
        <a-plane position="-0.78 0 0.012" width="0.06" height="1.05" color="#e84393"
          material="shader: flat; side: double">
        </a-plane>

        <!-- CARD TITLE -->
        <a-text value="VISITING CARD" position="-0.65 0.36 0.02" width="1.8" color="#ffd166" align="left" anchor="left">
        </a-text>

        <!-- YOUR NAME: EDIT THIS -->
        <a-text value="DIXIT" position="-0.65 0.16 0.02" width="2.2" color="#ffffff" align="left" anchor="left">
        </a-text>

        <!-- YOUR OCCUPATION: EDIT THIS -->
        <a-text value="Computer Science Student" position="-0.65 -0.04 0.02" width="1.8" color="#ffb3d9" align="left"
          anchor="left">
        </a-text>

        <!-- YOUR PLACE: EDIT THIS -->
        <a-text value="Place: SURAT" position="-0.65 -0.23 0.02" width="1.8" color="#ffffff" align="left"
          anchor="left">
        </a-text>

        <!-- YOUR DATE OF BIRTH: EDIT THIS -->
        <a-text value="DOB: 10-12-2005" position="-0.65 -0.39 0.02" width="1.8" color="#ffffff" align="left"
          anchor="left">
        </a-text>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");

    window.addEventListener("load", function () {
      const scene = document.querySelector("a-scene");

      scene.addEventListener("loaded", function () {
        status.textContent = "Camera ready! Point it at the Hiro marker.";
      });

      scene.addEventListener("arjs-video-loaded", function () {
        status.textContent = "Camera ready! Point it at the Hiro marker.";
      });
    });
  </script>
</body>

</html>
