<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Greeting Card</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      width: max-content;
      max-width: 85%;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    a-scene canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    video {
      object-fit: contain !important;
    }
  </style>
</head>

<body>
  <div id="status">Starting camera… Please wait.</div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

    <a-marker preset="hiro" smooth="true" smoothCount="5">
      <a-torus-knot position="0 0.35 0" color="#e84393" radius="0.12" radius-tubular="0.025" rotation="90 0 0"
        scale="0.8 0.8 0.8">
      </a-torus-knot>

      <a-sphere position="0.35 0.45 0" radius="0.09" color="#ffd166">
      </a-sphere>

      <a-sphere position="-0.35 0.45 0" radius="0.09" color="#06d6a0">
      </a-sphere>

      <a-text value="Best Wishes!" color="#ffffff" align="center" position="0 0 0.78 0" rotation="-90 0 0" width="2.5">
      </a-text>

      <a-text value="Have a wonderful day" color="#ffe8f1" align="center" position="0 0.68 0" rotation="-90 0 0"
        width="2">
      </a-text>

      <a-ring position="0 0.04 0" rotation="-90 0 0" radius-inner="0.30" radius-outer="0.32" color="#ffd166">
      </a-ring>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");

    window.addEventListener("load", function () {
      const scene = document.querySelector("a-scene");

      scene.addEventListener("loaded", function () {
        status.textContent = "Camera ready! Point it at the Hiro marker.";
      });

      scene.addEventListener("arjs-video-loaded", function () {
        status.textContent = "Camera ready! Point it at the Hiro marker.";
      });
    });
  </script>
</body>

</html>
