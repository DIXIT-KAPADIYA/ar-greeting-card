<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Greeting Card</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      width: max-content;
      max-width: 85%;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    a-scene canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    video {
      object-fit: contain !important;
    }
  </style>
</head>

<body>
  <div id="status">Starting camera… Please wait.</div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true; logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">

    <a-marker preset="hiro" smooth="true" smoothCount="5">

      
         
          <!-- VISITING CARD GROUP -->
          <a-entity id="visitingCard" position="0 1.0 0" rotation="-90 0 0" scale="0.8 0.8 0.8">
          
            <!-- Blue card background -->
            <a-plane
              position="0 0 0"
              width="2.0"
              height="1.1"
              color="#172554"
              material="shader: flat; side: double">
            </a-plane>
          
            <!-- Pink strip -->
            <a-plane
              position="-0.94 0 0.02"
              width="0.06"
              height="1.1"
              color="#e84393"
              material="shader: flat; side: double">
            </a-plane>
          
            <!-- All text is inside the same group -->
            <a-entity position="0 0 0.04">
          
              <a-text
                value="VISITING CARD"
                position="-0.82 0.38 0"
                width="1.6"
                color="#ffd166"
                align="left"
                anchor="left">
              </a-text>
          
              <a-text
                value="DIXIT KAPADIYA"
                position="-0.82 0.15 0"
                width="1.8"
                color="#ffffff"
                align="left"
                anchor="left">
              </a-text>
          
              <a-text
                value="Computer Science Student"
                position="-0.82 -0.07 0"
                width="1.6"
                color="#ffb3d9"
                align="left"
                anchor="left">
              </a-text>
          
              <a-text
                value="Place: SURAT"
                position="-0.82 -0.27 0"
                width="1.6"
                color="#ffffff"
                align="left"
                anchor="left">
              </a-text>
          
              <a-text
                value="DOB: 10-12-2005"
                position="-0.82 -0.43 0"
                width="1.6"
                color="#ffffff"
                align="left"
                anchor="left">
              </a-text>
          
            </a-entity>
          </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const status = document.getElementById("status");

    window.addEventListener("load", function () {
      const scene = document.querySelector("a-scene");

      scene.addEventListener("loaded", function () {
        status.textContent = "Camera ready! Point it at the Hiro marker.";
      });

      scene.addEventListener("arjs-video-loaded", function () {
        status.textContent = "Camera ready! Point it at the Hiro marker.";
      });
    });
  </script>
</body>

</html>
